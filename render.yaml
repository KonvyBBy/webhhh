services:
  - type: web
    name: lzt-market
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LZT_API_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DISCORD_BOT_SECRET
        sync: false
